[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cogym-kernel"
version = "0.1.0"
description = "Deterministic agentic evolution laboratory: worlds + policies + hard quality gates + experience memory"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
hashing = ["blake3"]
mcp = ["mcp"]

[project.scripts]
cogym = "cogym_kernel.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cogym_kernel"]
